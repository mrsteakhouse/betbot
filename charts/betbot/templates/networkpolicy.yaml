{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "betbot.fullname" . }}
  labels:
    {{- include "betbot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "betbot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # HTTPS to anywhere (kicktipp has no fixed IP)
    - ports:
        - { protocol: TCP, port: 443 }
    {{- with .Values.networkPolicy.extraEgress }}
    # Extra rules from values (e.g. a self-hosted ntfy on another port)
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
