image:
  repository: ghcr.io/mrsteakhouse/betbot
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Monday and Friday at 10:00 (timeZone below). Friday 10:00 is before the
# weekend matchday (starts Friday 20:30); Monday 10:00 is after the weekend and
# before midweek rounds (Tuesday/Wednesday evening). Existing tips are never
# overwritten (unless overwriteExistingTips is set), so repeated runs are harmless.
schedule: "0 10 * * 1,5"
timeZone: Europe/Berlin
suspend: false
startingDeadlineSeconds: 14400
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
# Total runtime cap for the Job including retries.
activeDeadlineSeconds: 1800
# Retries after exit code 1 (tenant failed / signal). Exit code 2 (invalid config) fails immediately.
backoffLimit: 2

# Compute and log tips without submitting them (adds --dry-run).
dryRun: false
# RUST_LOG filter, e.g. "info" or "info,betbot=debug".
logLevel: info

# Run the pod in its own user namespace (uid 65532 maps to an unprivileged host
# uid). Requires Kubernetes >= 1.33 (UserNamespacesSupport, default on), a
# runtime with support (containerd >= 2.0) and a kernel with idmapped mounts for
# tmpfs (>= 6.3). Set true to opt out on clusters that cannot do this.
hostUsers: false

serviceAccount:
  # Create a dedicated ServiceAccount (token is never mounted, no RBAC is granted).
  create: true
  # Defaults to the release fullname; with create: false defaults to "default".
  name: ""
  annotations: {}

# Ephemeral storage only holds the container's stdout logs; the root
# filesystem is read-only.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
    ephemeral-storage: 8Mi
  limits:
    cpu: 500m
    memory: 128Mi
    ephemeral-storage: 32Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Egress only to DNS (kube-system/kube-dns) and TCP 443 anywhere; no ingress.
# Requires a CNI/controller that enforces NetworkPolicy (k3s: kube-router does).
networkPolicy:
  enabled: false
  # Additional egress rules, rendered verbatim (e.g. a self-hosted ntfy or
  # generic webhook on another port):
  #   - to: [{ ipBlock: { cidr: 10.0.0.5/32 } }]
  #     ports: [{ protocol: TCP, port: 8080 }]
  extraEgress: []

# Rendered 1:1 into the app config (config.yaml), except per tenant:
#   existingSecret  chart-only: name of a Secret with the keys `username` and
#                   `password`. Mounted at /secrets/<tenant name>, and
#                   credentialsDir is set automatically. Removed from the app config.
# and per notifier:
#   existingSecret  chart-only: name of a Secret with the key `url` (shoutrrr-style
#                   notifier URL, e.g. telegram://..., discord://..., ntfy://...,
#                   generic://...). Mounted at /notifiers/<notifier name>/url, and
#                   urlFile is set automatically. Removed from the app config.
# Credentials and notifier URLs never belong in values. Create the Secrets
# yourself (see NOTES / README).
config:
  tenantTimeoutSeconds: 300
  # Required, at least one tenant. Example in README.md. A tenant references
  # notifiers by name: `notifiers: [telegram-main]`.
  tenants: []
  # Optional notification targets, e.g.
  #   - name: telegram-main
  #     existingSecret: betbot-notify-telegram
  # Each referencing tenant gets one summary per run, only when tips were
  # submitted, warnings occurred or the tenant failed.
  notifiers: []
