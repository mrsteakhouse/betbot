[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # scraper -> selectors/cssparser (unmodified use)
    "MPL-2.0",
]
confidence-threshold = 0.9

# rustls-platform-verifier -> webpki-root-certs (Mozilla CA data), only on
# wasm32; never part of the linux build.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-root-certs"

[licenses.private]
# betbot itself is unpublished (publish = false); its own license is checked too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
