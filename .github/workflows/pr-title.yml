name: PR title

# pull_request, never pull_request_target: no secrets or write token needed,
# and the workflow file from the PR is used (all contributors have write access).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types release-please understands (default changelog sections plus hidden ones).
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          # Scopes are optional and unrestricted (release-please and Dependabot use
          # `main` and `deps`).
          requireScope: false
          # Subject must not be empty or start with whitespace. Case is not enforced.
          subjectPattern: ^\S.*$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" must not
            be empty or start with whitespace. Expected: type(scope): subject
