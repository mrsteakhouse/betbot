# Example betbot configuration. In Kubernetes this file comes from a ConfigMap;
# credentials are never part of it (see credentialsDir below).
tenantTimeoutSeconds: 300

# Notification targets (optional). The URL carries tokens and is only read from
# urlFile (a mounted Secret), never written into this file. Formats:
#   telegram://<bot id>:<secret>@telegram?chats=@channel,123456[&notification=no]
#   discord://<webhook token>@<webhook id>
#   ntfy://[[user]:password@]host[:port]/topic[?scheme=http&priority=3&tags=a,b]
#   generic://[user:password@]host[:port]/path[?disabletls=yes&template=json|plain]
# Tenants reference them by name (`notifiers: [...]`) and get one summary per
# run, only when tips were submitted, warnings occurred or the tenant failed.
# notifiers:
#   - name: telegram-main
#     urlFile: /notifiers/telegram-main/url
tenants:
  # Offline tenant for local dry runs: matches, odds and tip history come from
  # a fixture file, nothing is sent anywhere.
  - name: demo
    platform:
      type: fake
      fixture: examples/fake-data.yaml
    odds: { type: platform }
    algorithm:
      type: poisson
      maxTipGoals: 5
      # Optional: pick deterministically (from seed and team names) among all
      # tips whose expected points are at most `tolerance` below the best, so
      # tenants with different seeds tip differently. tolerance 0..=1, 0 = off.
      # Seeds only make a difference where several tips are close in expected
      # points. Omit the block for the pure best tip.
      variation: { seed: 42, tolerance: 0.05 }
    # scoring omitted = kicktipp default (tendency 2, goal difference 3, exact 4,
    # no difference points for draws). This tenant uses a 3/2/1 scheme where
    # draws also get goal-difference points (1:1 vs 2:2 = 2).
    scoring:
      homeWin: { tendency: 1, goalDifference: 2, exact: 3 }
      draw:    { tendency: 1, goalDifference: 2, exact: 3 }
      awayWin: { tendency: 1, goalDifference: 2, exact: 3 }
    rules:
      maxSameResult: { max: 6, scope: matchday, mirrored: true }
    overwriteExistingTips: false

  # A real kicktipp tenant. credentialsDir points to a mounted Secret with the
  # files `username` and `password`.
  # - name: alice
  #   credentialsDir: /secrets/alice
  #   platform: { type: kicktipp, community: my-round-slug }
  #   odds: { type: platform }
  #   algorithm: { type: poisson, maxTipGoals: 5 }
  #   scoring:
  #     homeWin: { tendency: 2, goalDifference: 3, exact: 4 }
  #     draw:    { tendency: 2, exact: 4 }
  #     awayWin: { tendency: 2, goalDifference: 3, exact: 4 }
  #   rules:
  #     # kicktipp shows this limit as 'Strategieverbot Ergebnis' on the tip page;
  #     # the bot logs it but the config is authoritative.
  #     maxSameResult: { max: 6, scope: matchday, mirrored: true }
  #   overwriteExistingTips: false
  #   notifiers: [telegram-main]
